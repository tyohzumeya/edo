<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tree Audio UI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="controls">
    <div id="loop-toggle-container">
        <label for="loop-toggle">ループ:</label>
        <input type="checkbox" id="loop-toggle">
    </div>

    <div id="speed-slider-container">
        <label for="speed-slider">再生速度:</label>
        <input type="range" id="speed-slider" min="0.5" max="2" step="0.05" value="1">
        <span id="speed-value">1x</span>
    </div>
</div>

<div id="sidebar"></div>
<div id="content"></div>

<script src="js/app.js"></script>
</body>
</html>
